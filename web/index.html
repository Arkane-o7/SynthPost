<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050a11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Synthea Studio" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/synthpost-icon.svg" />
    <link rel="apple-touch-icon" href="/synthpost-icon.svg" />
    <script>
      (() => {
        const stored = localStorage.getItem("synthea-ui-theme") || "system";
        const dark = stored === "dark" || (stored === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.classList.toggle("light", !dark);
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", dark ? "#050a11" : "#f5f7fa");
      })();
    </script>
    <title>Synthea Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
